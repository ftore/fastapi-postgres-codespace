command:
  - "uvicorn"
  - "main:app"   # Assumes your FastAPI instantiation is called 'app' inside 'main.py'
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: ENV
    value: 'prod'
  # Postgres schema the tables live in; matches DBSCHEMA in .env-prod.
  - name: DBSCHEMA
    value: 'test'
  # Lakebase endpoint: projects/<id>/branches/<id>/endpoints/<id>
  - name: LAKEBASE_ENDPOINT_NAME
    value: 'projects/test/branches/production/endpoints/primary'
