[tool.poetry]
name = "fastapi-postgres-codespace"
version = "0.1.0"
description = "FastAPI + Postgres example converted to Poetry"
authors = ["akmal.rakhimov <akmal.rakhimov@example.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = ">=0.109.1"
uvicorn = {version = ">=0.18.0", extras = ["standard"]}
pydantic = ">=1.10.13,<2.0"
psycopg2 = ">=2.9.6,<3.0"
python-dotenv = ">=1.0.0,<2.0"
SQLAlchemy = ">=2.0.12,<3.0"
faker = ">=18.7.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0"
black = "^24.0"
ruff = "^0.12"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
